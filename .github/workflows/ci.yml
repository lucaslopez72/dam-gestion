name: Validación de DAM Gestión
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: dam-gestion-produccion
          path: www
