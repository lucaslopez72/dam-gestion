<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <div class="brand"><span class="brand-mark" aria-hidden="true">DG</span><div><strong>DAM Gestión</strong><small>Control de inventario</small></div></div>
          <p class="nav-caption">ESPACIO DE TRABAJO</p>

          @for (p of paginasVisibles; track p.url) {
            <ion-menu-toggle [autoHide]="false">
              <ion-item
                routerDirection="root"
                [routerLink]="[p.url]"
                routerLinkActive="selected"
                lines="none"
                [detail]="false"
              >
                <ion-icon
                  slot="start"
                  aria-hidden="true"
                  [ios]="p.icon + '-outline'"
                  [md]="p.icon + '-sharp'"
                ></ion-icon>
                <ion-label>{{ p.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
        <div class="session-card">
          <span class="session-dot" aria-hidden="true"></span>
          <div><strong>{{ auth.sesion()?.rol === 'admin' ? 'Administrador' : auth.sesion() ? 'Usuario estándar' : 'Acceso protegido' }}</strong><small>{{ auth.sesion()?.email || 'Inicia sesión para continuar' }}</small></div>
        </div>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
